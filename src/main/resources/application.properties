spring.application.name=appointment-system

# 数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/appointment_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 服务端口
server.port=8080

# JWT 配置
jwt.secret=ThisIsAVeryLongSecretKeyForJwtHmacSha256Signing_0123456789_abcdefghijklmnopqrstuvwxyz
jwt.expiration=3600
